name: Build Ludo APK

on: [push, workflow_dispatch]

env:
  GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=5000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Copy Web Assets to Android
      run: |
        mkdir -p app/src/main/assets
        cp index.html app/src/main/assets/
        cp style.css app/src/main/assets/
        cp game.js app/src/main/assets/
        if [ -d "assets" ]; then cp -r assets app/src/main/assets/; fi

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --refresh-dependencies

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ludo-Star-APK
        path: app/build/outputs/apk/debug/app-debug.apk
